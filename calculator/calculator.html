<!doctype html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COSC 1350</title>
    <link rel="stylesheet" href="calculatorstyle.css">
</head>
<body>

<main>
    <h1>Tip Calculator</h1>

    <div class ="calculator">
    <form action="" id="tipCalc" method="get" onsubmit="tipCalc(event)" onsubmit="return tipCalc()">
        <div class="billamt">
            <label for="Bill Amount">Bill Amount</label><br>
            <input type="number" step="0.01" id="billamt" name="billamnt" placeholder="000.00" required/>
        </div><br>

        <div class="service">
            <label for="Service">Service</label><br>
            <select id="service" name="service" required><br>
                <option value="excellent">Excellent (25%)</option>
                <option value="good">Good (20%)</option>
                <option value="fair">Fair (15%)</option>
                <option value="poor">Poor (10%)</option>
            </select>
        </div><br>

        <button type="submit">Submit</button>
    </form><br>
    
    <div class="output">
        <output form="tipCalc" id="output" name="output" for="billamt+service">
            <label for="tip">Tip</label>
            <p id="tipAmt">0</p>
            <label for="totalBill">Total Bill</label>
            <p id="totalBill">0</p></output>
        </div>
        
</main>
</body>
<script src="calculator.js" defer></script>
</html>
